name: ci-cd
on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: api
      - run: uv run pytest -q --cov=app --cov-fail-under=80
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  deploy:
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: ssh deploy
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          HOST: ${{ vars.VM_HOST }}
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: |
          install -m 600 /dev/null key; printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new github@"$HOST" "
            set -e
            if [ ! -d app/.git ]; then git clone --depth 1 https://github.com/${{ github.repository }}.git app; fi
            cd app && git fetch --depth 1 origin master && git reset --hard origin/master
            SITE_HOST=$SITE_HOST sudo -E docker compose -f compose.prod.yaml up -d --build --remove-orphans
            sudo docker image prune -f"
